name: build-and-deploy

# Merge/push vào production → build image amd64 (native runner ubuntu) → push GHCR :latest.
# Landing chỉ chạy production (cucquy.site) — KHÔNG có staging landing.
# Gate type-check chính là `npm run build` (Next.js) bên trong Docker: build lỗi → push fail → không deploy.
# keel (k3s @ ricevps) poll GHCR @every 1m và TỰ rollout deploy/landing trong ns cucquy.
# Không cần kubeconfig/SSH trong CI. Push GHCR bằng GITHUB_TOKEN (packages: write).
on:
  push:
    branches: [production]
  workflow_dispatch: {}

concurrency:
  group: deploy-landing-production
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cucquy/cucquy-landing

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - run: echo "Pushed ${IMAGE}:latest (+sha). keel tự rollout deploy/landing (ns cucquy) trong ~1 phút."
