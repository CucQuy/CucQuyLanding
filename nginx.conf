server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Site chạy sau Cloudflare Tunnel (TLS kết thúc ở ngoài) nên nginx chỉ thấy http.
    # Không có 2 dòng này, redirect thư mục (/privacy → /privacy/) trả về http:// tuyệt đối
    # làm rớt https — Meta từ chối URL kiểu đó khi khai chính sách quyền riêng tư.
    absolute_redirect off;
    port_in_redirect off;

    # Static export produces a directory per route with index.html (trailingSlash).
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Long cache for hashed Next.js assets.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache images.
    location ~* \.(png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
